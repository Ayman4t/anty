body{background-size:45px 45px;background-image:linear-gradient(to right,rgba(224,122,95,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,245,212,.04) 1px,transparent 1px)}

@media(prefers-reduced-motion:reduce){#cv.shk,.sm{animation:none}}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none;cursor:crosshair}
#cv.shk{animation:shk .5s}
.gp{background:rgba(16,18,27,.9);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 35px rgba(0,0,0,.65);border-radius:16px;pointer-events:auto}
#hd{position:fixed;top:calc(.6rem + env(safe-area-inset-top,0px));left:.6rem;right:.6rem;max-width:72rem;margin:0 auto;z-index:20;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;padding:.5rem .85rem}
.br{display:flex;align-items:center;gap:.65rem}
.lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#e07a5f,#d97706 50%,#8f301b);border:1px solid rgba(251,191,36,.4);display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 4px 14px rgba(208,90,63,.3)}

.bd{display:inline-flex;gap:4px;align-items:center;font-size:.7rem;font-weight:700;padding:1px 10px;border-radius:99px;background:rgba(245,158,11,.2);border:1px solid rgba(251,191,36,.5);color:#fcd34d;margin-inline-start:8px}
.sub{font-size:.7rem;color:#94a3b8;margin:0}
.cs{display:flex;align-items:center;gap:.5rem}

.cn.t{border-color:rgba(224,122,95,.35)}.cn.c{border-color:rgba(6,182,212,.35)}
.cn small{display:block;font-size:.6rem;color:#94a3b8;line-height:1}

.gb{font:inherit;font-weight:800;font-size:.75rem;color:#e2e8f0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.gb:hover{background:rgba(224,122,95,.2);border-color:rgba(224,122,95,.6);transform:translateY(-2px) scale(1.03);box-shadow:0 6px 20px rgba(224,122,95,.25)}
.gb:active{transform:translateY(1px) scale(.96)}
.gb:focus-visible,#txt:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.gb.on{background:rgba(0,245,212,.22);border-color:var(--cy);box-shadow:0 0 20px rgba(0,245,212,.45);color:#fff}
.cy{color:var(--cy);border-color:rgba(34,211,238,.4)}.am{color:#fcd34d;border-color:rgba(251,191,36,.4)}.em{color:#6ee7b7;border-color:rgba(52,211,153,.4)}.ro{color:#fda4af;border-color:rgba(244,63,94,.4)}.or{color:#fed7aa}

.sm:hover{background:linear-gradient(135deg,#e07a5f,#b8432a 50%,#ffb703);background-size:200% 200%;box-shadow:0 0 35px rgba(255,183,3,.75);transform:scale(1.04)}

.sep{width:1px;height:20px;background:rgba(255,255,255,.1)}

.fg{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.fg>span{font-size:.7rem;color:#94a3b8;font-weight:600}
